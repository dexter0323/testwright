tasks:
  app-setup:
    command: "node scripts/setup-app.ts"
    options:
      cache: false
      runInCI: false
      interactive: true
    description: "Interactively create a standardized app manifest and test layout."

  validate-apps:
    command: "node scripts/validate-apps.ts"
    options:
      cache: false
    description: "Validate all app manifests before test execution."

  test:
    command: "node scripts/run-tests.ts"
    deps:
      - "validate-apps"
    options:
      cache: false
      runFromWorkspaceRoot: true
      interactive: true
    description: "Run an app suite, for example: moon run test -- app=todomvc suite=ui."

  test-ci:
    command: "node scripts/run-tests.ts"
    deps:
      - "validate-apps"
    env:
      TESTWRIGHT_NON_INTERACTIVE: "1"
    options:
      cache: false
      runFromWorkspaceRoot: true
    description: "Run a manifest-selected app suite from a non-interactive shell."

  install-browsers:
    command: "pnpm exec playwright install chromium"
    options:
      cache: false
      runInCI: false
    description: "Install the Chromium browser used by the default test projects."

  install-browsers-ci:
    command: "pnpm exec playwright install --with-deps chromium"
    options:
      cache: false
    description: "Install Chromium and operating-system browser dependencies on Linux CI runners."

  check:
    command: "node scripts/check.ts"
    options:
      cache: false
    description: "Run app validation, static checks, formatting checks, and the TodoMVC UI smoke suite."

  docs:
    command: "bash scripts/docs/run.sh"
    options:
      cache: false
      runInCI: false
    description: "Build MkDocs, or pass -- --serve for a live preview."

  docs-build:
    command: "bash scripts/docs/run.sh --build"
    options:
      cache: false
    description: "Build the documentation site."

  typecheck:
    command: "pnpm exec tsc --noEmit -p tsconfig.json"
    description: "Type-check Playwright config, fixtures, reporters, and tests."

  lint:
    command: "pnpm exec eslint ."
    description: "Lint repository TypeScript and JavaScript."

  format:
    command: "pnpm exec prettier --write ."
    options:
      cache: false
    description: "Format repository source and configuration files."

  format-check:
    command: "pnpm exec prettier --check ."
    description: "Verify repository source and configuration formatting."
