site_name: TestWright
site_description: AI-assisted Playwright UI and API testing across applications.
site_url: https://dexter0323.github.io/testwright/
repo_url: https://github.com/dexter0323/testwright
edit_uri: edit/main/docs/content/

docs_dir: docs/content
site_dir: docs/site

theme:
  name: material
  features:
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Writing tests: writing-tests.md
  - App manifests: app-manifests.md
  - OpenCode workflow: opencode-workflow.md
  - Logs and debugging: logs-and-debugging.md
  - Troubleshooting: troubleshooting.md
