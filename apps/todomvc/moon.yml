language: "typescript"
layer: "automation"
tasks:
  test:
    command: "pnpm exec playwright test --project=todomvc-ui"
    deps:
      - "root:validate-apps"
    options:
      cache: false
      runFromWorkspaceRoot: true
    description: "Run the TodoMVC UI suite."

  test-ui:
    command: "pnpm exec playwright test --project=todomvc-ui"
    deps:
      - "root:validate-apps"
    options:
      cache: false
      runFromWorkspaceRoot: true
    description: "Run TodoMVC browser flow tests."

  test-api:
    command: "node scripts/run-app-tests.mjs todomvc api"
    deps:
      - "root:validate-apps"
    options:
      cache: false
      runFromWorkspaceRoot: true
    description: "Run TodoMVC API tests when the app manifest defines an API."

  test-journeys:
    command: "node scripts/run-app-tests.mjs todomvc journeys"
    deps:
      - "root:validate-apps"
    options:
      cache: false
      runFromWorkspaceRoot: true
    description: "Run TodoMVC cross-layer journey tests when available."
